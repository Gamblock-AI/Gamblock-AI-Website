name: Website CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/gamblock-ai/gamblock-ai-website

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:ai-context
      - run: npm run i18n:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        if: ${{ vars.ENABLE_CI_TESTS == 'true' }}

  build-push-deploy:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate public configuration
        shell: bash
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_API_URL_STAGING: ${{ vars.NEXT_PUBLIC_API_URL_STAGING }}
          NEXT_PUBLIC_APP_URL_STAGING: ${{ vars.NEXT_PUBLIC_APP_URL_STAGING }}
        run: |
          set -euo pipefail
          case "$NEXT_PUBLIC_API_URL" in
            https://*) ;;
            *) echo "NEXT_PUBLIC_API_URL must be a non-empty HTTPS URL" >&2; exit 1 ;;
          esac
          case "$NEXT_PUBLIC_APP_URL" in
            https://*) ;;
            *) echo "NEXT_PUBLIC_APP_URL must be a non-empty HTTPS URL" >&2; exit 1 ;;
          esac
          if [[ ! "$NEXT_PUBLIC_VAPID_PUBLIC_KEY" =~ ^B[A-Za-z0-9_-]{86}$ ]]; then
            echo "NEXT_PUBLIC_VAPID_PUBLIC_KEY must be a valid P-256 public key" >&2
            exit 1
          fi
          # Staging image build is optional: it runs only when the staging
          # public URLs are configured as repository variables.
          if [ -n "$NEXT_PUBLIC_API_URL_STAGING" ] || [ -n "$NEXT_PUBLIC_APP_URL_STAGING" ]; then
            case "$NEXT_PUBLIC_API_URL_STAGING" in
              https://*) ;;
              *) echo "NEXT_PUBLIC_API_URL_STAGING must be a non-empty HTTPS URL" >&2; exit 1 ;;
            esac
            case "$NEXT_PUBLIC_APP_URL_STAGING" in
              https://*) ;;
              *) echo "NEXT_PUBLIC_APP_URL_STAGING must be a non-empty HTTPS URL" >&2; exit 1 ;;
            esac
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern=v{{major}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push staging image
        if: vars.NEXT_PUBLIC_API_URL_STAGING != '' && vars.NEXT_PUBLIC_APP_URL_STAGING != ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:staging
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL_STAGING }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL_STAGING }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS via SSH
        if: github.ref == 'refs/heads/main' && vars.ENABLE_VPS_DEPLOY == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ vars.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          fingerprint: ${{ vars.VPS_HOST_FINGERPRINT }}
          script: |
            cd /opt/docker-stack/applications/gamblock-ai-website
            ./update.sh

  e2e:
    if: ${{ vars.ENABLE_CI_TESTS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
